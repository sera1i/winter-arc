<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}Winter Arc{% endblock %}</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070a'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23e0231c'/%3E%3C/svg%3E">
</head>
<body class="bg-ink text-bone min-h-screen flex flex-col selection:bg-vermilion selection:text-white">
    {% include 'base/navbar.html' %}
    
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow">
        {% if messages %}
            <div class="mb-6 space-y-2">
                {% for message in messages %}
                    <div class="p-4 rounded-xl backdrop-blur-md flex items-center justify-between text-sm font-medium
                        {% if message.tags == 'error' %}
                            bg-red-950/60 border border-red-800/60 text-red-300
                        {% elif message.tags == 'success' %}
                            bg-green-950/60 border border-green-800/60 text-green-300
                        {% else %}
                            bg-slate-900/80 border border-white/10 text-bone
                        {% endif %}">
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </main>

    {% include 'base/footer.html' %}
</body>
</html>
