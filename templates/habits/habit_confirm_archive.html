{% extends 'base/base.html' %}

{% block title %}Archive Habit | Winter Arc{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-12">
    <div class="arc-card text-center p-8 space-y-6">
        <div class="w-14 h-14 rounded-2xl bg-red-950/40 border border-red-800/50 text-red-400 flex items-center justify-center mx-auto text-xl shadow-glow-vermilion">
            📦
        </div>
        <div>
            <h1 class="text-2xl font-bold text-bone">Archive Habit?</h1>
            <p class="text-bone-muted text-sm mt-2">
                Archive <strong class="text-bone">"{{ habit.name }}"</strong>?<br>
                All past streak and completion history will be permanently preserved for analytics.
            </p>
        </div>
        <form method="post" class="flex items-center justify-center gap-3 pt-2">
            {% csrf_token %}
            <a href="{% url 'habits:detail' habit.pk %}" class="btn-secondary text-xs">Keep Active</a>
            <button type="submit" class="btn-danger text-xs font-bold !px-5 !py-2.5">
                Yes, Archive
            </button>
        </form>
    </div>
</div>
{% endblock %}
