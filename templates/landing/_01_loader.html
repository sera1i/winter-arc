{% load static %}
<!-- LOADER — "Winter is coming", live counter 0-100%, clean helmet artwork -->
<div id="wa-loader" 
     class="fixed inset-0 z-[100] bg-ink flex flex-col items-center justify-center select-none"
     style="contain: strict; will-change: opacity;"
     aria-hidden="true"
     aria-live="off">

    <!-- Atmospheric clean helmet artwork -->
    <div class="relative w-44 h-44 sm:w-56 sm:h-56 mb-8 overflow-hidden rounded-sm">
        <img src="{% static 'images/clean/loader_clean.webp' %}"
             alt=""
             width="224"
             height="224"
             class="w-full h-full object-contain opacity-80"
             decoding="async"
             loading="eager">
        <div class="absolute inset-0 pointer-events-none"
             style="background: radial-gradient(circle at 50% 60%, rgba(179,21,27,0.18) 0%, transparent 70%);"></div>
    </div>

    <!-- Master title -->
    <h1 class="font-serif text-3xl sm:text-4xl text-bone tracking-widest uppercase mb-2">
        Winter is coming
    </h1>

    <!-- Live counter and micro-label -->
    <div class="flex items-center gap-3 mb-6">
        <span class="w-1.5 h-1.5 bg-crimson rounded-full animate-ping"></span>
        <p class="font-mono text-xs uppercase tracking-[0.3em] text-ice/85">
            Lighting the beacons... <span id="loader-counter" class="text-bone font-bold ml-1">0%</span>
        </p>
    </div>

    <!-- Laser progress bar -->
    <div class="w-48 sm:w-64 h-0.5 bg-steel/30 relative overflow-hidden">
        <div id="loader-progress" 
             class="absolute inset-0 bg-crimson transition-transform duration-200 ease-out origin-left"
             style="transform: scaleX(0);"></div>
    </div>

</div>

<script>
(function() {
    'use strict';
    var loader = document.getElementById('wa-loader');
    if (!loader) return;

    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        loader.style.display = 'none';
        document.body.style.overflow = '';
        return;
    }

    var progress = document.getElementById('loader-progress');
    var counter = document.getElementById('loader-counter');
    var finished = false;

    function finish() {
        if (finished) return;
        finished = true;
        if (progress) progress.style.transform = 'scaleX(1)';
        if (counter) counter.textContent = '100%';

        setTimeout(function() {
            loader.style.transition = 'opacity 0.2s ease-out';
            loader.style.opacity = '0';
            setTimeout(function() {
                loader.style.display = 'none';
                try {
                    window.dispatchEvent(new CustomEvent('wa-loader-finished'));
                } catch (e) {}
            }, 200);
        }, 50);
    }

    // Animate progress smoothly via CSS compositor
    if (progress) {
        progress.style.transition = 'transform 0.42s cubic-bezier(0.16, 1, 0.3, 1)';
        requestAnimationFrame(function() {
            progress.style.transform = 'scaleX(1)';
        });
    }

    // Two clean non-blocking percentage updates
    setTimeout(function() {
        if (!finished && counter) counter.textContent = '54%';
    }, 180);

    setTimeout(function() {
        if (!finished && counter) counter.textContent = '88%';
    }, 340);

    // Finish loader cleanly
    var watchdog = setTimeout(finish, 480);

    if (document.readyState === 'complete') {
        setTimeout(finish, 200);
    } else {
        window.addEventListener('load', function() {
            setTimeout(finish, 80);
        }, { once: true });
    }
})();
</script>
